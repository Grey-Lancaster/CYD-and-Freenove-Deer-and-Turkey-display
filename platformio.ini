; Deer Hunt: animated woods scene (deer and turkeys wandering) for the Freenove FNK0104S (ESP32-S3 N16R8, 4.0" ST7796 480x320)
; and the CYD 2.8". Board layer carried over from CYD-and-Freenove-Fish-Tank. Build with `pio run -e freenove4` (default).
[platformio]
boards_dir = boards
default_envs = freenove4

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
lib_extra_dirs = lib_freenove
lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git
    ; On-device WiFi picker (LVGL is only used until the woods are online)
    https://github.com/Grey-Lancaster/TouchWifiProvisioner.git#1.6.8
    https://github.com/ayushsharma82/ElegantOTA.git#00674c4656def54f7f96a142c26c1f044a63043b
    lvgl/lvgl@8.4.0
build_flags =
    -O2
    -I include
    -DLV_CONF_INCLUDE_SIMPLE
    -DUSER_SETUP_LOADED=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

[env:freenove4]
board = ESP32-S3-WROOM-1-N16R8
board_build.partitions = default_16MB.csv
board_build.embed_files = src/ambience.raw
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DST7796_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=80000000
    -DUSE_HSPI_PORT=1

; Freenove FNK0104B/AB 2.8" (ESP32-S3 N16R8, ILI9341 320x240, FT6336U touch). Do NOT define USE_HSPI_PORT here.
[env:freenove28]
board = ESP32-S3-WROOM-1-N16R8
board_build.partitions = default_16MB.csv
board_build.embed_files = src/ambience.raw
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_FREENOVE28
    -DILI9341_2_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000

; CYD 2.8" with ILI9341 (one USB port, most common). The 2-USB boards use an ST7789: see cyd28usb2.
[env:cyd28]
board = esp32dev
board_build.partitions = min_spiffs.csv
board_build.embed_files = src/ambience.wav
build_flags =
    ${env.build_flags}
    -DBOARD_CYD28
    -DILI9341_2_DRIVER
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DUSE_HSPI_PORT

; CYD 2.8" with TWO USB ports: ST7789 panel instead of ILI9341 (same pins).
[env:cyd28usb2]
board = esp32dev
board_build.partitions = min_spiffs.csv
board_build.embed_files = src/ambience.wav
build_flags =
    ${env.build_flags}
    -DBOARD_CYD28
    -DST7789_DRIVER
    -DTFT_INVERSION_OFF
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DUSE_HSPI_PORT
